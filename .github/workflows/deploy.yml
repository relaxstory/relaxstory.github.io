name: Deploy to GitHub Pages

# 何時重新建置並部署到 https://relaxstory.github.io/ ：
#   - push 到 main
#   - 試算表選單「Re:LAX → 🔄 更新官網」（workflow_dispatch）
#   - 每天台灣時間 04:13 自動一次（重新讀取試算表的劇本目錄）
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '13 20 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    # 只在 repo 名稱為 relaxstory.github.io 時執行（改名前不會觸發部署）
    if: github.repository == 'relaxstory/relaxstory.github.io'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
